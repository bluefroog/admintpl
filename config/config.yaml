# ─────────────────────────────────────────────────────────────
# 应用配置（仅保留结构，具体值由根目录 .env 提供）
#   - 占位符语法：${KEY}（环境变量不存在时为空） / ${KEY:-默认值}
#   - 环境切换：just env dev  或  just env pro
#     （将 .env.dev / .env.pro 复制为 .env，.env 不入库）
#   - 优先级：系统环境变量 > .env 文件 > 此处默认值
# ─────────────────────────────────────────────────────────────
service:
  port: "${SERVICE_PORT:-:8080}"
  debug: "${SERVICE_DEBUG:-true}"
# 配置加密：敏感值（如数据库密码）可用 AES-256-GCM 密文书写，形如 ENC(xxxxx)
#   - 生成密文：just encrypt 'root:123456@tcp(127.0.0.1:3306)/admintpl?...'
#   - 支持整体加密（ENC(...)）与局部加密（root:ENC(...)@tcp(127.0.0.1:3306)/db?...）
#   - 解密在配置加载阶段统一完成，数据库等所有中间件拿到的都是明文
secret:
  enabled: "${CONFIG_ENCRYPT_ENABLED:-false}" # true：解密所有 ENC(...) 值（密钥缺失或解密失败则启动失败）
  algorithm: "${CONFIG_SECRET_ALGORITHM:-AES}" # 加密算法：AES（AES-256-GCM，默认）/ SM4（国密 SM4-CBC）
  key: "${CONFIG_SECRET_KEY:-}" # 加密密钥（任意字符串，内部 SHA-256 派生 32/16 字节），建议放 .env / 容器环境变量
# 数据库（多连接：connections 下每个键一套连接信息，default 指定默认连接）
#   - 业务代码用 database.DB / database.Default() 访问默认连接；
#     需要其它库时用 database.Get("log") 取句柄（不存在时回退默认并告警），
#     database.Use("log") 可把全局默认切换为指定连接
#   - type 决定 ORM 驱动（目前支持 mysql，其它类型启动即报错，避免配错却静默用错库）
#   - dsn 留空表示不启用该连接（启动时跳过），因此可以先写多套连接、按环境填 env 即可
database:
  default: "${DB_DEFAULT:-admin}" # 默认连接名（对应 connections 下的键）
  connections:
    # 主库：系统管理 / 系统监控 / 定时任务 / 代码生成等全部内置表
    admin:
      type: "${DB_TYPE:-mysql}" # 数据库类型：mysql（默认）
      dsn: "${DB_DSN:-root:123456@tcp(127.0.0.1:3306)/admintpl?charset=utf8mb4&parseTime=True&loc=Local}"
      prefix: "${DB_PREFIX:-}" # 表前缀
      singular: "${DB_SINGULAR:-true}" # 单数表名（true：User -> user / prefix_user）
      max-idle: "${DB_MAX_IDLE:-10}" # 连接池最大闲置的连接数
      max-open: "${DB_MAX_OPEN:-10}" # 连接池最大打开的连接数
      max-lifetime: "${DB_MAX_LIFETIME:-30}" # 连接对象可重复使用的时间长度(秒)
      debug: "${DB_DEBUG:-true}" # 是否开启 sql 调试模式
    # 其它库按需追加（示例见 config/config.example.yaml，环境变量用 DB_<名字>_* 前缀）：
    #   log:      日志库（登录/操作日志等高频写入独立存放）
    #   business: 业务库 / 只读从库

# 参数 / 字典缓存（sys_config 与 sys_dict 缓存，变更后失效，支持 /system/*/refresh-cache 手动刷新）
#   后端可选（driver）：
#     file     本地文件：进程内 map + gob 落盘（默认，单机部署无需外部依赖，重启不丢缓存）
#     memory   纯进程内内存：不持久化，仅测试或临时排查使用
#     memcache memcached：不支持枚举键（缓存监控页键列表为空），单条值最大 1MB，清空只能 FlushAll
#     redis    支持单机 / 主从 / 哨兵 / 集群四种部署模式（见下方 redis.mode）
cache:
  enabled: "${CACHE_ENABLED:-true}" # 是否启用参数与字典缓存（关闭后每次查询直接回源数据库，仅建议排查问题时使用）
  driver: "${CACHE_DRIVER:-file}" # 缓存后端：file（默认）/ memory / memcache / redis
  prefix: "${CACHE_PREFIX:-admintpl}" # 键前缀，多环境共用一个 memcache/redis 时用于隔离（实际键：前缀+缓存名+业务键）
  file:
    dir: "${CACHE_FILE_DIR:-runtime/cache}" # 本地文件目录（数据文件 cache.gob，容器内需可写）
    flush-interval: "${CACHE_FILE_FLUSH_INTERVAL:-5}" # 落盘间隔（秒），退出时（SIGTERM）会立即落盘
  memcache:
    servers: "${CACHE_MEMCACHE_SERVERS:-127.0.0.1:11211}" # 节点列表，多个以英文逗号分隔
    timeout: "${CACHE_MEMCACHE_TIMEOUT:-1}" # 连接与读写超时（秒）
  redis:
    # 部署模式：standalone 单机 / master-slave 主从 / sentinel 哨兵 / cluster 集群
    mode: "${CACHE_REDIS_MODE:-standalone}"
    addr: "${CACHE_REDIS_ADDR:-127.0.0.1:6379}" # 单机模式地址；主从/哨兵未配 addrs 时作为主节点/哨兵地址
    addrs: "${CACHE_REDIS_ADDRS:-}" # 主从模式节点列表（主节点在前，逗号分隔）
    cluster-addrs: "${CACHE_REDIS_CLUSTER_ADDRS:-}" # 集群模式节点列表（逗号分隔）
    master-name: "${CACHE_REDIS_MASTER_NAME:-mymaster}" # 哨兵模式的主节点名
    sentinel-addrs: "${CACHE_REDIS_SENTINEL_ADDRS:-}" # 哨兵节点列表（逗号分隔）
    sentinel-password: "${CACHE_REDIS_SENTINEL_PASSWORD:-}" # 哨兵自身密码（哨兵未开认证时留空）
    username: "${CACHE_REDIS_USERNAME:-}" # redis 6+ ACL 用户名（未启用 ACL 时留空）
    password: "${CACHE_REDIS_PASSWORD:-}" # redis 密码（可用 ENC(...) 密文）
    db: "${CACHE_REDIS_DB:-0}" # 逻辑库编号（单机/主从/哨兵有效，集群固定 0）
    timeout: "${CACHE_REDIS_TIMEOUT:-1}" # 连接与读写超时（秒）
    pool-size: "${CACHE_REDIS_POOL_SIZE:-10}" # 连接池大小

# 文件存储（统一文件上传/下载能力，common/s3；业务代码通过 s3.Default() 获取实例）
#   驱动可选（driver）：
#     local  本地目录：文件写入 local.dir，通过 local.url-prefix（或 public-base-url）对外访问，
#            需配合静态文件路由（router.Static）或反向代理（nginx）把该前缀映射到目录
#     minio  MinIO：S3 兼容对象存储
#     rustfs RustFS：S3 兼容对象存储（默认路径风格寻址、region=us-east-1）
#     cos    腾讯云 COS
#     oss    阿里云 OSS
s3:
  enabled: "${S3_ENABLED:-false}" # 是否启用文件存储（关闭时 s3.New()/s3.Default() 返回 ErrDisabled）
  driver: "${S3_DRIVER:-local}" # 存储驱动：local（默认）/ minio / rustfs / cos / oss
  public-base-url: "${S3_PUBLIC_BASE_URL:-}" # 对象访问地址公共前缀（CDN / 反向代理域名），留空时各后端使用自身默认值
  local:
    dir: "${S3_LOCAL_DIR:-runtime/uploads}" # 本地目录（容器内需可写）
    url-prefix: "${S3_LOCAL_URL_PREFIX:-/uploads}" # 对外访问前缀（需静态路由/反向代理映射到 dir）
  minio:
    endpoint: "${S3_MINIO_ENDPOINT:-127.0.0.1:9000}" # 服务地址（host:port 或带 scheme 的 URL）
    access-key: "${S3_MINIO_ACCESS_KEY:-}" # Access Key
    secret-key: "${S3_MINIO_SECRET_KEY:-}" # Secret Key（可用 ENC(...) 密文）
    bucket: "${S3_MINIO_BUCKET:-admintpl}" # 存储桶
    region: "${S3_MINIO_REGION:-}" # 区域，留空自动向服务端查询
    secure: "${S3_MINIO_SECURE:-false}" # 是否使用 HTTPS（endpoint 带 scheme 时以 scheme 为准）
    path-style: "${S3_MINIO_PATH_STYLE:-false}" # 是否强制路径风格寻址（endpoint 为 IP 时建议开启）
  rustfs:
    endpoint: "${S3_RUSTFS_ENDPOINT:-127.0.0.1:9000}" # 服务地址（host:port 或带 scheme 的 URL）
    access-key: "${S3_RUSTFS_ACCESS_KEY:-}" # Access Key
    secret-key: "${S3_RUSTFS_SECRET_KEY:-}" # Secret Key（可用 ENC(...) 密文）
    bucket: "${S3_RUSTFS_BUCKET:-admintpl}" # 存储桶
    region: "${S3_RUSTFS_REGION:-us-east-1}" # 区域（RustFS 等 S3 兼容实现通常固定 us-east-1）
    secure: "${S3_RUSTFS_SECURE:-false}" # 是否使用 HTTPS
    path-style: "${S3_RUSTFS_PATH_STYLE:-true}" # 是否强制路径风格寻址（RustFS 默认开启）
  cos:
    bucket-url: "${S3_COS_BUCKET_URL:-}" # 存储桶访问域名（优先，如 https://demo-1250000000.cos.ap-guangzhou.myqcloud.com）
    bucket: "${S3_COS_BUCKET:-}" # 存储桶名（bucket-url 为空时与 region 一起拼接访问域名）
    region: "${S3_COS_REGION:-}" # 地域，如 ap-guangzhou（bucket-url 为空时使用）
    secret-id: "${S3_COS_SECRET_ID:-}" # 腾讯云 SecretId
    secret-key: "${S3_COS_SECRET_KEY:-}" # 腾讯云 SecretKey（可用 ENC(...) 密文）
    domain: "${S3_COS_DOMAIN:-}" # 自定义访问域名（CDN），留空使用 bucket-url
  oss:
    endpoint: "${S3_OSS_ENDPOINT:-oss-cn-hangzhou.aliyuncs.com}" # 访问域名（不带 bucket 前缀）
    access-key-id: "${S3_OSS_ACCESS_KEY_ID:-}" # 阿里云 AccessKeyId
    access-key-secret: "${S3_OSS_ACCESS_KEY_SECRET:-}" # 阿里云 AccessKeySecret（可用 ENC(...) 密文）
    bucket: "${S3_OSS_BUCKET:-admintpl}" # 存储桶
    domain: "${S3_OSS_DOMAIN:-}" # 自定义访问域名（CDN），留空使用 https://<bucket>.<endpoint>

system:
  # 认证与权限（enabled=false 时所有 /system 接口免登录，便于本地调试）
  auth:
    enabled: "${AUTH_ENABLED:-true}" # 是否开启登录认证
    token-expire: "${AUTH_TOKEN_EXPIRE:-720}" # 令牌有效期（分钟）
    max-retry: "${AUTH_MAX_RETRY:-5}" # 连续登录失败次数上限（0 表示不限制）
    lock-time: "${AUTH_LOCK_TIME:-10}" # 登录失败锁定时间（分钟）
    permission-enabled: "${AUTH_PERMISSION_ENABLED:-false}" # 是否按请求路径校验角色权限标识
  # 图形验证码
  captcha:
    enabled: "${CAPTCHA_ENABLED:-false}" # 是否开启登录验证码
    length: "${CAPTCHA_LENGTH:-4}" # 验证码位数
    expire: "${CAPTCHA_EXPIRE:-120}" # 验证码有效期（秒）
  seed:
    # 基础数据初始化（部门/角色/用户/菜单/字典/定时任务等，仅当对应表为空时写入）
    enabled: "${SEED_ENABLED:-false}"
  # 定时任务调度
  job:
    enabled: "${JOB_ENABLED:-true}" # 是否启动定时任务调度器（关闭后任务不再自动触发，手动「执行一次」仍可用）
    log-retain-days: "${JOB_LOG_RETAIN_DAYS:-30}" # 定时任务日志保留天数（启动时清理，<=0 表示不清理）
  # 数据权限（按登录用户角色的数据范围过滤列表数据）
  data-scope:
    enabled: "${DATA_SCOPE_ENABLED:-true}" # 是否开启数据权限过滤（关闭后所有登录用户可见全部数据，仅建议调试使用）
  # 代码生成（导入数据库表 -> 维护生成配置 -> 生成代码）
  gen:
    package-name: "${GEN_PACKAGE_NAME:-github.com/bluefroog/admintpl}" # 生成代码的包路径（Go module 前缀）
    module-name: "${GEN_MODULE_NAME:-system}" # 生成代码所属模块（app/<module>）
    author: "${GEN_AUTHOR:-bluefrog}" # 生成功能作者
    auto-remove-pre: "${GEN_AUTO_REMOVE_PRE:-true}" # 表名生成实体类名时是否去掉表前缀
    table-prefix: "${GEN_TABLE_PREFIX:-sys_}" # 表前缀，多个以英文逗号分隔

# 环境变量清单（.env / 容器环境变量 / 系统环境变量均可注入，优先级从高到低）：
#   CONFIG_ENCRYPT_ENABLED CONFIG_SECRET_ALGORITHM CONFIG_SECRET_KEY
#   SERVICE_PORT SERVICE_DEBUG
#   DB_DEFAULT DB_TYPE DB_DSN DB_PREFIX DB_SINGULAR DB_MAX_IDLE DB_MAX_OPEN DB_MAX_LIFETIME DB_DEBUG
#   AUTH_ENABLED AUTH_TOKEN_EXPIRE AUTH_MAX_RETRY AUTH_LOCK_TIME AUTH_PERMISSION_ENABLED
#   CAPTCHA_ENABLED CAPTCHA_LENGTH CAPTCHA_EXPIRE
#   SEED_ENABLED
#   JOB_ENABLED JOB_LOG_RETAIN_DAYS
#   DATA_SCOPE_ENABLED
#   S3_ENABLED S3_DRIVER S3_PUBLIC_BASE_URL S3_LOCAL_DIR S3_LOCAL_URL_PREFIX
#   S3_MINIO_ENDPOINT S3_MINIO_ACCESS_KEY S3_MINIO_SECRET_KEY S3_MINIO_BUCKET S3_MINIO_REGION
#   S3_MINIO_SECURE S3_MINIO_PATH_STYLE
#   S3_RUSTFS_ENDPOINT S3_RUSTFS_ACCESS_KEY S3_RUSTFS_SECRET_KEY S3_RUSTFS_BUCKET S3_RUSTFS_REGION
#   S3_RUSTFS_SECURE S3_RUSTFS_PATH_STYLE
#   S3_COS_BUCKET_URL S3_COS_BUCKET S3_COS_REGION S3_COS_SECRET_ID S3_COS_SECRET_KEY S3_COS_DOMAIN
#   S3_OSS_ENDPOINT S3_OSS_ACCESS_KEY_ID S3_OSS_ACCESS_KEY_SECRET S3_OSS_BUCKET S3_OSS_DOMAIN
#   CACHE_ENABLED CACHE_DRIVER CACHE_PREFIX
#   CACHE_FILE_DIR CACHE_FILE_FLUSH_INTERVAL
#   CACHE_MEMCACHE_SERVERS CACHE_MEMCACHE_TIMEOUT
#   CACHE_REDIS_MODE CACHE_REDIS_ADDR CACHE_REDIS_ADDRS CACHE_REDIS_CLUSTER_ADDRS
#   CACHE_REDIS_MASTER_NAME CACHE_REDIS_SENTINEL_ADDRS CACHE_REDIS_SENTINEL_PASSWORD
#   CACHE_REDIS_USERNAME CACHE_REDIS_PASSWORD CACHE_REDIS_DB CACHE_REDIS_TIMEOUT CACHE_REDIS_POOL_SIZE
#   GEN_PACKAGE_NAME GEN_MODULE_NAME GEN_AUTHOR GEN_AUTO_REMOVE_PRE GEN_TABLE_PREFIX
