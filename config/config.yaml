# ─────────────────────────────────────────────────────────────
# 应用配置（仅保留结构，具体值由根目录 .env 提供）
#   - 占位符语法：${KEY}（环境变量不存在时为空） / ${KEY:-默认值}
#   - 环境切换：just env dev  或  just env pro
#     （将 .env.dev / .env.pro 复制为 .env，.env 不入库）
#   - 优先级：系统环境变量 > .env 文件 > 此处默认值
# ─────────────────────────────────────────────────────────────
service:
  port: "${SERVICE_PORT:-:8080}"
  debug: "${SERVICE_DEBUG:-true}"
database:
  admin:
    type: "${DB_TYPE:-mysql}"
    dsn: "${DB_DSN:-root:123456@tcp(127.0.0.1:3306)/ruoyi?charset=utf8mb4&parseTime=True&loc=Local}"
    prefix: "${DB_PREFIX:-}" # 表前缀
    max-idle: "${DB_MAX_IDLE:-10}" # 连接池最大闲置的连接数
    max-open: "${DB_MAX_OPEN:-10}" # 连接池最大打开的连接数
    max-lifetime: "${DB_MAX_LIFETIME:-30}" #连接对象可重复使用的时间长度(秒)
    debug: "${DB_DEBUG:-true}" # 是否开启 sql 调试模式
system:
  # 认证与权限（enabled=false 时所有 /system 接口免登录，便于本地调试）
  auth:
    enabled: "${AUTH_ENABLED:-true}" # 是否开启登录认证
    token-expire: "${AUTH_TOKEN_EXPIRE:-720}" # 令牌有效期（分钟）
    max-retry: "${AUTH_MAX_RETRY:-5}" # 连续登录失败次数上限（0 表示不限制）
    lock-time: "${AUTH_LOCK_TIME:-10}" # 登录失败锁定时间（分钟）
    permission-enabled: "${AUTH_PERMISSION_ENABLED:-false}" # 是否按请求路径校验角色权限标识
  # 图形验证码
  captcha:
    enabled: "${CAPTCHA_ENABLED:-false}" # 是否开启登录验证码
    length: "${CAPTCHA_LENGTH:-4}" # 验证码位数
    expire: "${CAPTCHA_EXPIRE:-120}" # 验证码有效期（秒）
  seed:
    # 基础数据初始化（部门/角色/用户/菜单/字典/定时任务等，仅当对应表为空时写入）
    enabled: "${SEED_ENABLED:-false}"
  # 定时任务调度
  job:
    enabled: "${JOB_ENABLED:-true}" # 是否启动定时任务调度器（关闭后任务不再自动触发，手动「执行一次」仍可用）
    log-retain-days: "${JOB_LOG_RETAIN_DAYS:-30}" # 定时任务日志保留天数（启动时清理，<=0 表示不清理）

# 环境变量清单（.env / 容器环境变量 / 系统环境变量均可注入，优先级从高到低）：
#   SERVICE_PORT SERVICE_DEBUG
#   DB_TYPE DB_DSN DB_PREFIX DB_MAX_IDLE DB_MAX_OPEN DB_MAX_LIFETIME DB_DEBUG
#   AUTH_ENABLED AUTH_TOKEN_EXPIRE AUTH_MAX_RETRY AUTH_LOCK_TIME AUTH_PERMISSION_ENABLED
#   CAPTCHA_ENABLED CAPTCHA_LENGTH CAPTCHA_EXPIRE
#   SEED_ENABLED
#   JOB_ENABLED JOB_LOG_RETAIN_DAYS
