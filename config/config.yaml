# ─────────────────────────────────────────────────────────────
# 应用配置（仅保留结构，具体值由根目录 .env 提供）
#   - 占位符语法：${KEY}（环境变量不存在时为空） / ${KEY:-默认值}
#   - 环境切换：just env dev  或  just env pro
#     （将 .env.dev / .env.pro 复制为 .env，.env 不入库）
#   - 优先级：系统环境变量 > .env 文件 > 此处默认值
# ─────────────────────────────────────────────────────────────
service:
  port: "${SERVICE_PORT:-:8080}"
  debug: "${SERVICE_DEBUG:-true}"
database:
  admin:
    type: "${DB_TYPE:-mysql}"
    dsn: "${DB_DSN:-root:123456@tcp(127.0.0.1:3306)/ruoyi?charset=utf8mb4&parseTime=True&loc=Local}"
    prefix: "${DB_PREFIX:-}" # 表前缀
    max-idle: "${DB_MAX_IDLE:-10}" # 连接池最大闲置的连接数
    max-open: "${DB_MAX_OPEN:-10}" # 连接池最大打开的连接数
    max-lifetime: "${DB_MAX_LIFETIME:-30}" #连接对象可重复使用的时间长度(秒)
    debug: "${DB_DEBUG:-true}" # 是否开启 sql 调试模式
